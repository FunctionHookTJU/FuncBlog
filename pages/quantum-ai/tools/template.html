<script>
(function(){
  /* ---------- 主题与目录折叠（与 P1/P2 讲义一致） ---------- */
  var h=document.documentElement, saved=null, hide=null;
  try{ saved=localStorage.getItem('jys-theme'); hide=localStorage.getItem('jys-navhide'); }catch(e){}
  if(saved!=='dark') h.classList.add('light');   /* 默认浅色，贴合站点 */
  if(hide==='1') h.classList.add('navhide');

  document.getElementById('toggle').onclick=function(){
    h.classList.toggle('light');
    try{localStorage.setItem('jys-theme', h.classList.contains('light')?'light':'dark')}catch(e){}
  };
  function setHide(v){
    h.classList.toggle('navhide', v);
    try{localStorage.setItem('jys-navhide', v?'1':'0')}catch(e){}
  }
  document.getElementById('shide').onclick=function(){ setHide(true); };
  document.getElementById('reopen').onclick=function(){ setHide(false); };

  /* ---------- 当前章节高亮 ---------- */
  var side=document.getElementById('side');
  var links=[].slice.call(side.querySelectorAll('a[data-h]'));
  var heads=links.map(function(a){return document.getElementById(a.getAttribute('data-h'));});
  var userScrolled=false, timer=null;
  side.addEventListener('wheel', function(){ userScrolled=true; clearTimeout(timer);
    timer=setTimeout(function(){ userScrolled=false; }, 4000); }, {passive:true});

  function update(){
    var y=window.scrollY+150, idx=-1;
    for(var i=0;i<links.length;i++){
      if(heads[i] && heads[i].offsetTop<=y) idx=i;
    }
    if(idx<0 && links.length) idx=0;
    for(var k=0;k<links.length;k++) links[k].classList.toggle('cur', k===idx);
    var cur=links[idx];
    if(cur && !userScrolled){
      var rt=cur.offsetTop, rb=rt+cur.offsetHeight;
      if(rt<side.scrollTop+36 || rb>side.scrollTop+side.clientHeight-36){
        side.scrollTop=Math.max(0, rt-side.clientHeight/2);
      }
    }
  }
  window.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update);
  update();

  /* ---------- KaTeX 渲染（保持离线、页面内完成） ---------- */
  function texOf(el){
    var t = el.textContent || '';
    t = t.replace(/^\s*\\\(/,'').replace(/\\\)\s*$/,'');
    t = t.replace(/^\s*\\\[/,'').replace(/\\\]\s*$/,'');
    return t.trim();
  }
  function renderMath(){
    if (typeof katex === 'undefined'){ console.warn('[math] KaTeX 未加载'); return; }
    var nodes = document.querySelectorAll('span.jysmath, div.jysmath');
    for (var i=0;i<nodes.length;i++){
      var n = nodes[i];
      try{
        katex.render(texOf(n), n, {
          throwOnError:false,
          displayMode: n.classList.contains('jysmath-display'),
          strict:false, trust:false
        });
      }catch(e){}
    }
    if (typeof renderMathInElement === 'function'){
      try{
        renderMathInElement(document.getElementById('doc') || document.body, {
          delimiters:[
            {left:'$$',right:'$$',display:true},
            {left:'\\[',right:'\\]',display:true},
            {left:'\\(',right:'\\)',display:false},
            {left:'$',right:'$',display:false}
          ],
          ignoredTags:['script','noscript','style','textarea','pre','code','option'],
          throwOnError:false
        });
      }catch(e){}
    }
    update();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderMath);
  else renderMath();
})();
</script>
