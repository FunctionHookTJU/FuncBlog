        // 使用SHA-256计算密码哈希
        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // 日记 MD 加载 + 分页 + 日历
        document.addEventListener('DOMContentLoaded', function() {
            var entriesPerPage = 8;
            var currentPage = 1;
            var diaryEntries = [];
            var totalPages = 1;

            var container = document.getElementById('diary-entries');
            var prevPageBtn = document.getElementById('prev-page');
            var nextPageBtn = document.getElementById('next-page');
            var pageInfo = document.getElementById('page-info');

            // ===== 分页函数 =====
            function showPage(page) {
                for (var i = 0; i < diaryEntries.length; i++) {
                    diaryEntries[i].classList.add('hidden');
                }
                var start = (page - 1) * entriesPerPage;
                var end = start + entriesPerPage;
                if (end > diaryEntries.length) end = diaryEntries.length;
                for (var i = start; i < end; i++) {
                    diaryEntries[i].classList.remove('hidden');
                }
                pageInfo.textContent = '第 ' + page + ' 页 / 共 ' + totalPages + ' 页';
                prevPageBtn.disabled = (page === 1);
                nextPageBtn.disabled = (page === totalPages);
                var content = document.querySelector('.content-section');
                if (content) content.scrollIntoView({ behavior: 'smooth' });
            }

            prevPageBtn.addEventListener('click', function() {
                if (currentPage > 1) { currentPage--; showPage(currentPage); }
            });
            nextPageBtn.addEventListener('click', function() {
                if (currentPage < totalPages) { currentPage++; showPage(currentPage); }
            });

            // ===== 加载并渲染 Markdown 日记 =====
            fetch('diary.md')
                .then(function(response) {
                    if (!response.ok) throw new Error('日记加载失败: ' + response.status);
                    return response.text();
                })
                .then(function(mdText) {
                    // 在 MD 文本层面按 "## " 切分条目（比解析 HTML 后遍历 DOM 更可靠）
                    // 先去掉开头的空白，然后按 "\n## " 分割
                    var trimmed = mdText.replace(/^\s+/, '');
                    var chunks = trimmed.split(/\r?\n## /);

                    for (var i = 0; i < chunks.length; i++) {
                        var chunk = chunks[i];
                        // 第一行是日期标题（去掉可能的前导 ## 空格）
                        var lines = chunk.split(/\r?\n/);
                        var title = lines[0].replace(/^##\s*/, '').trim();
                        // 剩余部分是正文 Markdown
                        var bodyMd = lines.slice(1).join('\n').trim();

                        if (!title) continue;

                        // 用 marked 解析正文为 HTML
                        var bodyHtml = bodyMd ? marked.parse(bodyMd) : '';

                        // 创建条目 DOM
                        var entryDiv = document.createElement('div');
                        entryDiv.className = 'diary-entry hidden';

                        var dateDiv = document.createElement('div');
                        dateDiv.className = 'entry-date';
                        dateDiv.textContent = title;

                        var contentDiv = document.createElement('div');
                        contentDiv.className = 'entry-content';
                        contentDiv.innerHTML = bodyHtml;

                        entryDiv.appendChild(dateDiv);
                        entryDiv.appendChild(contentDiv);
                        container.appendChild(entryDiv);
                    }

                    // 刷新 diaryEntries 并初始化分页
                    diaryEntries = Array.from(container.querySelectorAll('.diary-entry'));
                    totalPages = Math.ceil(diaryEntries.length / entriesPerPage);
                    if (totalPages < 1) totalPages = 1;
                    showPage(currentPage);
                })
                .catch(function(err) {
                    console.error(err);
                    container.innerHTML = '<p style="color:red;">日记加载失败，请稍后重试。</p>';
                });

            // ===== 日历功能（不变） =====
            var calendarBody = document.getElementById('calendar-body');
            var calendarTitle = document.getElementById('calendar-title');
            var prevMonthBtn = document.getElementById('prev-month');
            var nextMonthBtn = document.getElementById('next-month');

            var today = new Date();
            var currentYear = today.getFullYear();
            var currentMonth = today.getMonth();

            function renderCalendar(year, month) {
                var monthNames = ['1月','2月','3月','4月','5月','6月',
                                  '7月','8月','9月','10月','11月','12月'];
                calendarTitle.textContent = year + '年' + monthNames[month];
                calendarBody.innerHTML = '';

                var firstDay = new Date(year, month, 1);
                var lastDay = new Date(year, month + 1, 0);
                var daysInMonth = lastDay.getDate();
                var firstDayOfWeek = firstDay.getDay();
                var prevLastDay = new Date(year, month, 0).getDate();
                var totalCells = Math.ceil((firstDayOfWeek + daysInMonth) / 7) * 7;

                var date = 1;
                var nextMonthDate = 1;

                for (var cell = 0; cell < totalCells; cell++) {
                    if (cell % 7 === 0) {
                        var row = document.createElement('tr');
                    }
                    var td = document.createElement('td');
                    if (cell < firstDayOfWeek) {
                        td.textContent = prevLastDay - firstDayOfWeek + cell + 1;
                        td.classList.add('other-month');
                    } else if (date > daysInMonth) {
                        td.textContent = nextMonthDate;
                        td.classList.add('other-month');
                        nextMonthDate++;
                    } else {
                        td.textContent = date;
                        if (date === today.getDate() &&
                            month === today.getMonth() &&
                            year === today.getFullYear()) {
                            td.classList.add('today');
                        }
                        date++;
                    }
                    row.appendChild(td);
                    if (cell % 7 === 6 || cell === totalCells - 1) {
                        calendarBody.appendChild(row);
                    }
                }
            }

            renderCalendar(currentYear, currentMonth);

            prevMonthBtn.addEventListener('click', function() {
                currentMonth--;
                if (currentMonth < 0) { currentMonth = 11; currentYear--; }
                renderCalendar(currentYear, currentMonth);
            });

            nextMonthBtn.addEventListener('click', function() {
                currentMonth++;
                if (currentMonth > 11) { currentMonth = 0; currentYear++; }
                renderCalendar(currentYear, currentMonth);
            });
        });
    </script>
